name: Release

on:
  push:
    branches:
      - main  # Run on pushes to the main branch

# Writes to main go through the GitHub App installation token minted below;
# the workflow's own token is read-only.
permissions:
  contents: read

jobs:
  release:
    # The org IP allow list blocks GitHub-hosted runners from pushing here, and
    # this public repository can use only the public-release runner group,
    # which GitHub restricts to this workflow on main.
    runs-on:
      group: public-release
      labels: skyslope-public-release
    # Limited to main, with a required reviewer.
    environment: release

    steps:
      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The installation grants contents only; issue and PR comments are disabled in release.config.js
          permission-contents: write  # push the release commit and tag, create the GitHub release

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # semantic-release pushes with the app token; keep the checkout token out of git config
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @semantic-release/npm 13 requires Node >= 22.14
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        env:
          # This job doesn't launch a browser, and Puppeteer 19 has no Linux ARM64 Chromium to download.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build project
        run: npm run build:prod

      - name: Verify dist directory
        run: |
          if [ ! -d "dist" ] || [ ! -d "loader" ]; then
            echo "Error: dist or loader directory is missing"
            exit 1
          fi
          ls -la dist/
          ls -la loader/

      - name: List files to be published
        run: npm pack --dry-run

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
