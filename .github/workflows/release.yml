name: Release

on:
  push:
    branches:
      - main  # Run on pushes to the main branch

jobs:
  release:
    runs-on: skyslope-ops
    env:
      # skyslope-ops is ARM64; puppeteer 19 has no linux-arm64 Chromium and fails npm ci.
      # This job does not run a browser.
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:prod

      - name: Verify dist directory
        run: |
          if [ ! -d "dist" ] || [ ! -d "loader" ]; then
            echo "Error: dist or loader directory is missing"
            exit 1
          fi
          ls -la dist/
          ls -la loader/

      - name: List files to be published
        run: npm pack --dry-run

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
